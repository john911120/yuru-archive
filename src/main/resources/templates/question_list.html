<html lang="ja" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-4">

  <div class="app-page-toolbar row align-items-center gy-3 mb-4">
    <div class="col-lg-4 text-center text-lg-start">
      <a th:href="@{/question/create}" class="btn btn-primary px-4">質問を登録する</a>
    </div>
    <div class="col-lg-8">
      <form th:action="@{/question/list}" method="get" id="searchForm">
        <input type="hidden" id="page" name="page" th:value="${paging.number}">
        <div class="d-flex justify-content-center justify-content-lg-end">
          <div class="input-group" style="max-width: 660px;">
            <select class="form-select" name="type" th:value="${type}" style="max-width: 130px;">
              <option value="subject" th:selected="${type == 'subject'}">タイトル</option>
              <option value="author" th:selected="${type == 'author'}">作成者</option>
            </select>
            <input type="text" class="form-control" name="kw" th:value="${kw}" placeholder="キーワードを入力">
            <button type="submit" class="btn btn-outline-primary">検索</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="table-responsive app-table-shell">
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr class="text-center">
          <th>番号</th>
          <th style="width:50%">タイトル</th>
          <th>作成者</th>
          <th>作成日</th>
        </tr>
      </thead>
      <tbody>
        <tr class="text-center" th:each="question, loop : ${paging}">
          <td th:text="${paging.getTotalElements - (paging.number * paging.size) - loop.index}"></td>
          <td class="text-start">
            <a class="fw-semibold text-decoration-none" th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
            <span class="text-muted small" th:text="'[' + (${answerCountMap[question.id]} ?: 0) + ']'"></span>
          </td>
          <td><span th:if="${question.author != null}" th:text="${question.author.username}"></span></td>
          <td class="text-nowrap" th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:if="${!paging.isEmpty()}">
    <ul class="pagination justify-content-center flex-wrap">
      <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
        <a class="page-link" href="javascript:void(0)" th:data-page="${paging.number-1}">以前</a>
      </li>
      <li th:each="page: ${#numbers.sequence(0, paging.totalPages-1)}"
          th:if="${page >= paging.number-5 and page <= paging.number+5}"
          th:classappend="${page == paging.number} ? 'active'" class="page-item">
        <a th:text="${page + 1}" class="page-link" href="javascript:void(0)" th:data-page="${page}"></a>
      </li>
      <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
        <a class="page-link" href="javascript:void(0)" th:data-page="${paging.number+1}">次</a>
      </li>
    </ul>
  </div>
</div>

<script layout:fragment="script" type="text/javascript">
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('searchForm');
    const pageInput = document.getElementById('page');

    if (form && pageInput) {
      form.addEventListener('submit', function () {
        pageInput.value = 0;
      });
    }

    document.querySelectorAll('.page-link[data-page]').forEach(function (element) {
      element.addEventListener('click', function () {
        if (!form || !pageInput || this.closest('.page-item')?.classList.contains('disabled')) {
          return;
        }
        pageInput.value = this.dataset.page;
        form.submit();
      });
    });
  });
</script>
</html>
