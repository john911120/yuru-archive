<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-4" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3">
        <div>
            <h3 class="mb-1">会員情報</h3>
            <p class="text-body-secondary mb-0">登録している基本情報と住所を確認できます。</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/user/profile/edit}" class="btn btn-primary">会員情報を編集</a>
            <a th:href="@{/user/password}" class="btn btn-outline-primary">パスワード変更</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${profileUpdated}">
        会員情報を更新しました。
    </div>

    <div class="alert alert-success" th:if="${passwordChanged}">
        パスワードを変更しました。
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4 py-2">ユーザーID</dt>
                <dd class="col-sm-8 py-2" th:text="${siteUser.username}"></dd>

                <dt class="col-sm-4 py-2">メールアドレス</dt>
                <dd class="col-sm-8 py-2" th:text="${siteUser.email}"></dd>

                <dt class="col-sm-4 py-2">郵便番号</dt>
                <dd class="col-sm-8 py-2" th:text="${siteUser.zipcode}"></dd>

                <dt class="col-sm-4 py-2">都道府県</dt>
                <dd class="col-sm-8 py-2" th:text="${siteUser.address1}"></dd>

                <dt class="col-sm-4 py-2">市区町村</dt>
                <dd class="col-sm-8 py-2" th:text="${siteUser.address2}"></dd>

                <dt class="col-sm-4 py-2">町名</dt>
                <dd class="col-sm-8 py-2" th:text="${siteUser.address3}"></dd>

                <dt class="col-sm-4 py-2">詳細住所</dt>
                <dd class="col-sm-8 py-2" th:text="${siteUser.addressDetail}"></dd>
            </dl>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-outline-secondary">トップへ戻る</a>
    </div>
</div>
</html>
