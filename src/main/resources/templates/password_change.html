<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-4" style="max-width: 680px;">
    <div class="mb-3">
        <h3 class="mb-1">パスワード変更</h3>
        <p class="text-body-secondary mb-0">現在のパスワードを確認したうえで、新しいパスワードへ変更します。</p>
    </div>

    <form th:action="@{/user/password}" th:object="${userPasswordForm}" method="post" class="card shadow-sm">
        <div class="card-body">
            <div th:replace="~{form_errors :: formErrorsFragment}"></div>

            <div class="mb-3">
                <label for="currentPassword" class="form-label">現在のパスワード</label>
                <input type="password" th:field="*{currentPassword}" id="currentPassword"
                       class="form-control" autocomplete="current-password">
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label">新しいパスワード</label>
                <input type="password" th:field="*{newPassword}" id="newPassword"
                       class="form-control" autocomplete="new-password">
                <div class="form-text">8文字以上100文字以内で入力してください。</div>
            </div>

            <div class="mb-3">
                <label for="newPasswordConfirm" class="form-label">新しいパスワード確認</label>
                <input type="password" th:field="*{newPasswordConfirm}" id="newPasswordConfirm"
                       class="form-control" autocomplete="new-password">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">パスワードを変更</button>
                <a th:href="@{/user/profile}" class="btn btn-outline-secondary">キャンセル</a>
            </div>
        </div>
    </form>
</div>
</html>
